services:
  borealis:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - PHP_IDE_CONFIG=serverName=borealis
      - XDEBUG_MODE=debug
      - XDEBUG_SESSION=start
      - CADDY_SERVER_FRANKENPHP_OPTIONS=
      - APP_INDEX_FILE=index.php
    depends_on:
      - redis
      - database

  horizon:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "horizon" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - database
      - redis
    healthcheck:
      disable: true

  scheduler:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "schedule:work" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - database
      - redis
    healthcheck:
      disable: true

  database:
    image: mariadb:10.5-focal
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./mariadb:/var/lib/mysql

  redis:
    image: redis:6.2.6
    restart: unless-stopped

  composer:
    profiles: [ "composer" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "composer" ]
    command: [ "--version" ]
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  npm:
    profiles: [ "npm" ]
    image: node:23
    entrypoint: [ "npm" ]
    command: [ "" ]
    working_dir: /app
    volumes:
      - ./:/app

  artisan:
    profiles: [ "artisan" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "php", "/app/artisan" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - database
    healthcheck:
      disable: true


  shell:
    profiles: [ "shell" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/bin/sh" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - database
    healthcheck:
      disable: true
